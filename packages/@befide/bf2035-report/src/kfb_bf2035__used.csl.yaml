- id: agarwal_etal__2022__snowmass_2021_community
  abstract: >-
    The Snowmass Community Survey was designed by the Snowmass Early Career
    (SEC) Survey Core Initiative team between April 2020 and June 2021, and
    released to the community on June 28, 2021. It aims to be a comprehensive
    assessment of the state of the high-energy particle and astrophysics (HEPA)
    community, if not the field, though the Snowmass process is largely based
    within the United States. Among other topics, some of the central foci of
    the Survey were to gather demographic, career, physics outlook, and
    workplace culture data on a large segment of the Snowmass community. With
    nearly $1500$ total interactions with the Survey, the SEC Survey team hopes
    the findings and discussions within this report will be of service to the
    community over the next decade. Some conclusions should reinforce the
    aspects of HEPA which are already functional and productive, while others
    should strengthen arguments for cultural and policy changes within the
    field.
