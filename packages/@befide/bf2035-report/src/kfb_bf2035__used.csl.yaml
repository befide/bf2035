- id: haseyama_etal__2024__questionnaire_survey_brazilian
  abstract: >-
    In this study, we conducted a survey of researchers studying flies in
    Brazil, with the aim of acquiring up-to-date information about them, across
    multiple aspects, i.e., demographics, opinions, needs, and the main
    challenges they face. We developed an online questionnaire and collected the
    responses between September and November 2019; 126 responses were received.
    Most of them held a Ph.D. and identified themselves as males. Nearly all
    respondents worked exclusively in public institutions, and most were
    financially reliant on scholarships provided by public agencies. All of them
    studied at least one of the 81 dipteran families known to occur in Brazil,
    with most respondents working on families that included taxa of public
    health importance. Additionally, most work conducted by these researchers
    was rooted in systematics/taxonomy. A specific portion of the respondents
    (i.e., students) felt less integrated into the research community and found
    it challenging to publish high-impact research. However, some concerns were
    shared across all respondent subgroups, such as the need for increased
    funding and a more seamless integration within the research community.
    Academic professionals highlighted limited funding and inadequate
    infrastructure as barriers to research. Nevertheless, some subgroups
    expressed concerns about their career prospects. Although there may be
    limitations in the sampling process underpinning this study, our survey
    provides valuable insights into the demographic characteristics of Brazilian
    dipterist community, thus facilitating the development of policy strategies.

    KEY WORDS:

    Brazil; careers; demography; Diptera; funding; outreach
